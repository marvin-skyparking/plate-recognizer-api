version: "3.8"

services:
  platerecognizer:
    image: gustiawan24/lpr-api:v1.3.9
    container_name: platerecognizer

    ports:
      - "8080:8000"

    restart: unless-stopped

    volumes:
      - ./data:/app/data

    # ============================================================
    # NVIDIA GPU
    # ============================================================
    # gpus: all

    environment:
      # ============================================================
      # API
      # ============================================================
      LPR_API_KEY: "Zkajsasasauha"
      LICENSE_KEY: "AKMNR-GHDNK-5CJ4L-KXISP-CAAAA-AAAAA-AAAAA-ANXOQ-NLTB2-ZCWI4-ZGVD4-OHIBC-UYCA5-T2CH7-US"
      ENABLE_DEBUG: false
      LPR_MAX_CONCURRENT_RECOGNITIONS: 4
      LPR_ONNX_INTRA_OP_THREADS: 4
      LPR_DETECTOR_MIN_CONF: 0.15

      # ============================================================
      # IMPORTANT
      # ============================================================
      #
      # DO NOT put detector/OCR configuration here.
      #
      # They will come from app/config.py:
      #
      # LPR_DETECTOR_MODEL
      # LPR_DETECTOR_MIN_CONF
      # LPR_MIN_RESULT_DETECTOR_CONF
      # LPR_OCR_MODEL
      # LPR_MIN_OCR_CONF
      # LPR_ENABLE_TILED_DETECTION
      # LPR_SECOND_STAGE_ROI_ENABLED
      # LPR_CAMERA_CROP_ENABLED
      # LPR_ONNX_DEVICE
      # LPR_DETECTOR_CONFIDENCE_BOOST
      #
      # ============================================================

    networks:
      - lpr-network


networks:
  lpr-network:
    external: true
