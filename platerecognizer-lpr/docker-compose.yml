version: "3.8"

services:
  platerecognizer:
    image: yudasiskariot/lpr-api:v1.1.1
    container_name: platerecognizer

    ports:
      - "8080:8000"

    environment:
      # API
      LPR_API_KEY: "Zkajsasasauha"

      # Detection
      LPR_DETECTOR_MIN_CONF: "0.35"
      LPR_MIN_RESULT_DETECTOR_CONF: "0.45"
      LPR_ENABLE_TILED_DETECTION: "true"
      LPR_TILED_DETECTION_CONF: "0.65"
      LPR_TILED_DETECTION_MIN_WIDTH_RATIO: "0.18"

      # Detection ROI
      # Format: x,y,width,height (normalized 0..1)
      LPR_DETECTION_ROI: ""
      LPR_DETECTION_ROI_FALLBACK_FULL_FRAME: "true"

      # Fast detection
      LPR_DETECTION_FAST_CONFIDENCE: "0.85"
      LPR_DETECTION_FAST_MIN_WIDTH_RATIO: "0.18"

      # OCR
      LPR_MIN_OCR_CONF: "0.70"
      LPR_OCR_PREPROCESSING_VARIANTS: "3"
      LPR_REQUIRE_INDONESIA_PLATE_FORMAT: "true"
      LPR_OCR_MIN_CROP_WIDTH: "512"
      LPR_OCR_UPSCALE_UNSHARP_AMOUNT: "0.5"
      LPR_OCR_UPSCALE_UNSHARP_SIGMA: "1.0"
      LPR_OCR_CONFUSION_CONFIDENCE_THRESHOLD: "1.0"

      # Fallbacks
      LPR_ENABLE_GLARE_FALLBACK: "true"
      LPR_ENABLE_GRAYSCALE_FALLBACK: "true"

      # Upload
      LPR_MAX_UPLOAD_MB: "20"

      # GPU / CPU
      # CUDA first, CPU fallback
      LPR_ONNX_DEVICE: "both"
      LPR_ONNX_INTRA_OP_THREADS: "24"

      # Runtime
      LPR_MAX_DETECTION_CANDIDATES: "1"
      LPR_MAX_INPUT_DIMENSION: "1280"

      # Temporal voting
      LPR_PLATE_VOTING_REQUIRED_OBSERVATIONS: "3"
      LPR_PLATE_VOTING_WINDOW_SECONDS: "5"

    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    networks:
      - lpr-network

networks:
  lpr-network:
    external: true