version: "3.8"

services:
  platerecognizer:
    image: yudasiskariot/lpr-api:v1.0.0
    container_name: platerecognizer
    ports:
      - "8080:8000"
    environment:
      LPR_API_KEY: "Zkajsasasauha"
      LPR_DETECTOR_MIN_CONF: "0.35"
      LPR_MIN_OCR_CONF: "0.60"
      LPR_MAX_UPLOAD_MB: "10"
    restart: unless-stopped
    networks:
      - lpr-network

networks:
  lpr-network:
    external: true