version: "3.8"

services:
  platerecognizer:
    image: yudasiskariot/lpr-api:v1.1.4
    container_name: platerecognizer

    ports:
      - "8080:8000"

    restart: unless-stopped

    # ============================================================
    # NVIDIA GPU
    # ============================================================
    gpus: all

    environment:
      # ============================================================
      # API
      # ============================================================
      LPR_API_KEY: "Zkajsasasauha"

      # ============================================================
      # Detection
      # ============================================================
      LPR_DETECTOR_MODEL: "yolo-v9-t-256-license-plate-end2end"

      # Keep detector permissive.
      # OCR confidence + Indonesia plate format are the final gates.
      LPR_DETECTOR_MIN_CONF: "0.20"
      LPR_MIN_RESULT_DETECTOR_CONF: "0.25"

      # ============================================================
      # Detection candidates
      # ============================================================
      # 2 gives a second candidate when the top detector box
      # is not actually the license plate.
      LPR_MAX_DETECTION_CANDIDATES: "2"

      # ============================================================
      # Tiled Detection
      # ============================================================
      # Useful for wide 1080p/1440p CCTV where the plate is small.
      LPR_ENABLE_TILED_DETECTION: "true"
      LPR_TILED_DETECTION_CONF: "0.65"
      LPR_TILED_DETECTION_MIN_WIDTH_RATIO: "0.18"

      # ============================================================
      # Detection ROI
      # ============================================================
      # Empty = full-frame detection.
      #
      # If all cameras have the same framing, you can later set:
      # LPR_DETECTION_ROI: "x,y,width,height"
      #
      # Keep fallback enabled because you have ~30 gates/cameras.
      LPR_DETECTION_ROI: ""
      LPR_DETECTION_ROI_FALLBACK_FULL_FRAME: "true"

      # ============================================================
      # Detection -> OCR crop
      # ============================================================
      LPR_OCR_CROP_PADDING_X: "0.12"
      LPR_OCR_CROP_PADDING_Y: "0.20"
      LPR_OCR_CROP_MIN_PADDING_PX: "2"

      # ============================================================
      # Fast detection
      # ============================================================
      LPR_DETECTION_FAST_CONFIDENCE: "0.85"
      LPR_DETECTION_FAST_MIN_WIDTH_RATIO: "0.18"

      # ============================================================
      # OCR
      # ============================================================
      LPR_OCR_MODEL: "cct-s-v2-global-model"

      # Real OCR quality gate
      LPR_MIN_OCR_CONF: "0.70"

      LPR_OCR_PREPROCESSING_VARIANTS: "4"
      LPR_REQUIRE_INDONESIA_PLATE_FORMAT: "true"

      # IMPORTANT:
      # Small detector crops are upscaled before OCR.
      LPR_OCR_MIN_CROP_WIDTH: "512"

      # Sharpen after upscaling
      LPR_OCR_UPSCALE_UNSHARP_AMOUNT: "0.5"
      LPR_OCR_UPSCALE_UNSHARP_SIGMA: "1.0"

      # Character confusion correction
      LPR_OCR_CONFUSION_CONFIDENCE_THRESHOLD: "0.70"

      # ============================================================
      # Fallbacks
      # ============================================================
      LPR_ENABLE_GLARE_FALLBACK: "true"
      LPR_ENABLE_GRAYSCALE_FALLBACK: "true"
      LPR_ENABLE_FRAGMENT_RECOVERY: "true"

      # ============================================================
      # Upload
      # ============================================================
      LPR_MAX_UPLOAD_MB: "20"

      # ============================================================
      # GPU / ONNX Runtime
      # ============================================================
      # gpu = CUDA first, CPU fallback.
      #
      # Your build_onnx_providers() supports:
      # cpu / gpu / both / cuda / auto
      #
      # Use gpu explicitly for this server.
      LPR_ONNX_DEVICE: "gpu"

      # Per inference call.
      # Keep low enough to allow multiple concurrent requests.
      LPR_ONNX_INTRA_OP_THREADS: "4"

      # ============================================================
      # Recognition concurrency
      # ============================================================
      # Only applies if your patched main.py uses this setting.
      #
      # 28 CPU cores / 4 threads ~= 7 concurrent recognitions.
      LPR_MAX_CONCURRENT_RECOGNITIONS: "7"

      # ============================================================
      # Runtime / Input Resolution
      # ============================================================
      # IMPORTANT:
      # 100 was much too small.
      #
      # 1280 means:
      #
      # 720p  -> stays 1280x720
      # 1080p -> becomes 1280x720-ish
      # 1440p -> becomes <=1280 on long side
      #
      # OCR still uses the original-resolution crop.
      LPR_MAX_INPUT_DIMENSION: "1280"

      # ============================================================
      # Temporal voting
      # ============================================================
      LPR_PLATE_VOTING_REQUIRED_OBSERVATIONS: "3"
      LPR_PLATE_VOTING_WINDOW_SECONDS: "5"

      # ============================================================
      # CCTV Overlay Ignore Regions
      # ============================================================
      #
      # top-right timestamp:
      # x=0.76 y=0.01 w=0.21 h=0.04
      #
      # bottom-left camera label:
      # x=0.00 y=0.94 w=0.35 h=0.06
      #
      LPR_DETECTION_IGNORE_OVERLAY_REGIONS: "0.76,0.01,0.21,0.04;0.0,0.94,0.35,0.06"

    networks:
      - lpr-network

networks:
  lpr-network:
    external: true