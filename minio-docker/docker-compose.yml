services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: lpr-minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: lpradmin
      MINIO_ROOT_PASSWORD: lpradmin123

    volumes:
      - minio_lpr_data:/mnt/data
      - ./minio.license:/minio.license:ro

    command:
      - server
      - /mnt/data
      - --console-address
      - ":9001"
      - --license
      - /minio.license

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 20s
      retries: 3

    networks:
      - lpr-network

volumes:
  minio_lpr_data:

networks:
  lpr-network:
    external: true